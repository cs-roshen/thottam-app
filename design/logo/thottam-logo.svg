<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <title>Thottam</title>
  <!-- Master mark: a coconut palm against the sun, on the primary tile.
       Colours are design tokens: primary #1B6B3A, accent #F2B01E, ground #F4F6F1.
       The palm is drawn once (#palm); the mask cuts a 3.5 px gap around it
       from the sun, so the mark still reads in one colour.
       tool/build_icons.py builds every launcher icon from this file. -->
  <rect width="96" height="96" rx="24" fill="#1B6B3A"/>
  <g id="mark">
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96">
      <rect width="96" height="96" fill="#fff"/>
      <use href="#palm" fill="#000" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
    </mask>
    <circle cx="56" cy="38" r="23" fill="#F2B01E" mask="url(#gap)"/>
    <g fill="#F4F6F1">
      <g id="palm">
        <path d="M48 44C38 28 21 29 13 46C24 36 37 37 48 44Z"/>
        <path d="M48 44C45 27 34 17 21 15C31 23 41 32 48 44Z"/>
        <path d="M48 44C52 28 62 19 75 17C65 25 55 33 48 44Z"/>
        <path d="M48 44C59 31 74 33 83 49C72 39 59 39 48 44Z"/>
        <path d="M39 80C41 66 44 55 46.5 45L51.5 46C49 57 46 67 45 80C45 83 39 83 39 80Z"/>
        <circle cx="48.5" cy="45" r="4.5"/>
      </g>
    </g>
  </g>
</svg>
